<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: dark navy -->
  <rect width="512" height="512" rx="96" fill="#0A0A1F"/>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Center origin dot -->
  <circle cx="180" cy="256" r="24" fill="#6C63FF"/>

  <!-- Sound wave arc 1 (closest) -->
  <path d="M210,210 Q260,256 210,302"
        stroke="#6C63FF" stroke-width="20" fill="none"
        stroke-linecap="round"/>

  <!-- Sound wave arc 2 (medium) -->
  <path d="M252,172 Q320,256 252,340"
        stroke="#9B8FFF" stroke-width="20" fill="none"
        stroke-linecap="round"/>

  <!-- Sound wave arc 3 (farthest) -->
  <path d="M294,134 Q390,256 294,378"
        stroke="#00D9FF" stroke-width="20" fill="none"
        stroke-linecap="round"/>

  <!-- V letter for VibeWave branding -->
  <path d="M80,170 L130,340 L180,170 L155,170 L130,290 L105,170 Z"
        fill="url(#waveGrad)"/>
</svg>
