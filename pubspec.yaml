name: vibewave
description: "VibeWave - Premium Music Streaming App with YouTube Integration, Firebase & AI Recommendations"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.3
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Audio Engine
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.12
  audio_session: ^0.1.21
  audio_service: ^0.18.15

  # YouTube Integration
  youtube_explode_dart: ^2.2.1

  # State Management
  flutter_riverpod: ^2.5.1

  # UI & Design
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  palette_generator: ^0.3.3+3
  flutter_animate: ^4.5.0

  # Navigation
  go_router: ^14.2.7

  # Notifications
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

  # Utils
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.4.2
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
