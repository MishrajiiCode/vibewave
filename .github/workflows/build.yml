name: Build & Release VibeWave

on:
  push:
    branches: [main, "release/**"]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Run analysis
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run tests
        run: flutter test

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/vibewave-release.jks
          elif [ ! -f android/vibewave-release.jks ]; then
            echo "$DEFAULT_KEYSTORE_B64" | base64 -d > android/vibewave-release.jks
          fi
        env:
          DEFAULT_KEYSTORE_B64: 

      - name: Build APK (Release)
        run: flutter build apk --release --verbose

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibewave-apk
          path: build/app/outputs/flutter-apk/*.apk

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: vibewave-apk
          path: ./apks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./apks/*.apk
          generate_release_notes: true
          name: "VibeWave ${{ github.ref_name }}"
          body: |
            ## VibeWave ${{ github.ref_name }}

            ### Installation
            1. Download the APK for your device architecture:
               - `arm64-v8a` - Modern 64-bit Android phones
               - `armeabi-v7a` - Older 32-bit Android phones
               - `x86_64` - Android emulators
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK

            > **Note**: You need to set up your own Firebase project. See [README.md](README.md) for instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
